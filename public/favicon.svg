<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .tile {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 90px;
        text-anchor: middle;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="200" height="200" rx="16" fill="#fff" />

  <!-- 2x2 网格，每个方块 72x72，间距 8，居中 -->
  <!-- 左上 - S -->
  <rect x="8" y="8" width="88" height="88" rx="6" fill="#6aaa64" />
  <text x="52" y="52" dy="0.35em" class="tile">S</text>

  <!-- 右上 - Y -->
  <rect x="104" y="8" width="88" height="88" rx="6" fill="#c9b458" />
  <text x="148" y="52" dy="0.35em" class="tile">Y</text>

  <!-- 左下 - S -->
  <rect x="8" y="104" width="88" height="88" rx="6" fill="#6aaa64" />
  <text x="52" y="148" dy="0.35em" class="tile">S</text>

  <!-- 右下 - X -->
  <rect x="104" y="104" width="88" height="88" rx="6" fill="#787c7e" />
  <text x="148" y="148" dy="0.35em" class="tile">X</text>
</svg>